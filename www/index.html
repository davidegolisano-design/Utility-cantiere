<!doctype html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111827">
  <meta name="description" content="Utility tecniche rapide per il cantiere">
  <title>Utility Cantiere</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">OFFLINE · v0.02</div>
      <h1>Utility Cantiere</h1>
    </div>
    <button id="homeButton" class="icon-button hidden" type="button" aria-label="Torna alla home">⌂</button>
  </header>

  <main id="app" class="app-shell"></main>

  <template id="homeTemplate">
    <section>
      <label class="search-label" for="toolSearch">Trova uno strumento</label>
      <input id="toolSearch" class="search" type="search" placeholder="es. flange, chiavi, allineamento…" autocomplete="off">
      <div id="toolGrid" class="tool-grid"></div>
    </section>
  </template>

  <script src="app.js"></script>
</body>
</html>
