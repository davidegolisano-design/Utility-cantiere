name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'www/**'
      - 'package.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate JavaScript
        run: npm run check

      - name: Create Android project
        run: npx cap add android

      - name: Sync web app
        run: npx cap sync android

      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Utility-Cantiere.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Utility-Cantiere-v0.02-APK
          path: Utility-Cantiere.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish latest APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest Utility-Cantiere.apk --target main --title "Utility Cantiere v0.02" --notes "v0.02: modulo Chiavi e bulloneria operativo, ricerca diretta/inversa e dati metrici ISO/DIN legacy."
